<div class="container py-4 bg-light min-vh-100">

  <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 650px;">
    <div class="card-header bg-primary text-white rounded-top-4">

      <div class="d-flex justify-content-between align-items-center">

      <h3 class="mb-0 fw-semibold">
      ✏️ Edit Project Allocation
      </h3>

      <span *ngIf="hasChanges()" class="badge bg-warning text-dark"> Unsaved Changes</span>

      </div>

    </div>

    <div class="card-body p-4" *ngIf="allocationArray; else loadingOrError">

      <div class="row g-3">
        <!-- Employee Info (Disabled) -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Employee ID</label>
          <input type="text" class="form-control" [value]="allocationArray.employeeId" disabled />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Employee Name</label>
          <input type="text" class="form-control" [value]="allocationArray.employeeName" disabled />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Project ID</label>
          <input type="text" class="form-control" [value]="allocationArray.projectId" disabled />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Project Name</label>
          <input type="text" class="form-control" [value]="allocationArray.projectName" disabled />
        </div>

        <!-- Editable Fields -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Role</label>
          <select [(ngModel)]="role" class="form-select">
            <option value="On Role">On Role</option>
            <option value="Off Role">Off Role</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Allocation %</label>
          <input type="number" [(ngModel)]="allocation" class="form-control" min="1" max="100" />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Start Date</label>
          <input type="date" [(ngModel)]="allocationStart" class="form-control" />
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">End Date</label>
          <input type="date" [(ngModel)]="allocationEnd" class="form-control" />
        </div>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary" (click)="goBack()">
          <i class="bi bi-arrow-left"></i> Back
        </button>
        <button class="btn btn-success px-4" (click)="updateAllocation()" [disabled]="!hasChanges()">
          <i class="bi bi-save"></i> Update Allocation
        </button>
      </div>
    </div>

    <!-- Loading / Error -->
    <ng-template #loadingOrError>
      <div class="p-4 text-center">
        <div *ngIf="loading" class="spinner-border text-primary" role="status"></div>
        <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{errorMessage}}</div>
      </div>
    </ng-template>

  </div>
</div>
