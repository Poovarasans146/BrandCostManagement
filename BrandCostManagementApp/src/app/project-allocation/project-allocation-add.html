<div class="container py-4 bg-light min-vh-100">
  <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 700px;">
    <div class="card-header bg-primary text-white text-center rounded-top-4">
      <h3 class="mb-0 fw-semibold">🎯 Create Project Allocation</h3>
    </div>

    <div class="card-body p-4">
      <!-- Employee Selection -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Select Employee</label>
        <select [(ngModel)]="selectedEmployeeId" class="form-select" (change)="onEmployeeChange()">
          <option value="">-- Select Employee --</option>
          <option *ngFor="let e of employees" [value]="e.employeeId">
            {{e.name}} ({{e.employeeId}})
          </option>
        </select>
      </div>

      <!-- Employee Details in Disabled Inputs -->
      <div *ngIf="employeeDetails" class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Mobile Number</label>
          <input type="text" class="form-control" [value]="employeeDetails.mobileNumber || 'NA'" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="text" class="form-control" [value]="employeeDetails.emailId || 'NA'" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" [value]="employeeDetails.location || 'NA'" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" [value]="employeeDetails.address || 'NA'" disabled>
        </div>
      </div>

      <!-- Role -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Role</label>
        <select [(ngModel)]="role" class="form-select">
          <option value="On Role">On Role</option>
          <option value="Off Role">Off Role</option>
        </select>
      </div>

      <!-- Business Unit -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Business Unit (BU)</label>
        <select [(ngModel)]="selectedBU" class="form-select" (change)="onBUChange()">
          <option value="">-- Select BU --</option>
          <option *ngFor="let b of bus" [value]="b">{{b}}</option>
        </select>
      </div>

      <!-- Project Selection -->
      <div class="mb-3" *ngIf="projects.length">
        <label class="form-label fw-semibold">Project ID</label>
        <select [(ngModel)]="selectedProjectId" class="form-select" (change)="onProjectChange()">
          <option value="">-- Select Project --</option>
          <option *ngFor="let p of projects" [value]="p.projectId">{{p.projectId}}</option>
        </select>
      </div>

      <!-- Project Details in Disabled Inputs -->
      <div *ngIf="projectDetails" class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Project Name</label>
          <input type="text" class="form-control" [value]="projectDetails.projectName" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label">Brand</label>
          <input type="text" class="form-control" [value]="projectDetails.brand" disabled>
        </div>
      </div>

      <!-- Allocation Inputs -->
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Allocation (%)</label>
          <input type="number" [(ngModel)]="allocation" class="form-control" min="1" max="100" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Allocation Start Date</label>
          <input type="date" [(ngModel)]="allocationStart" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Allocation End Date</label>
          <input type="date" [(ngModel)]="allocationEnd" class="form-control" />
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-secondary me-2" (click)="cancel()">Cancel</button>
        <button class="btn btn-success" (click)="createAllocation()">Create Allocation</button>
      </div>
    </div>
  </div>
</div>
