<div class="container py-4">
  <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white text-center rounded-top-4">
      <h3 class="mb-0 fw-semibold">➕ Add New User</h3>
    </div>

    <div class="card-body p-4">
      <!-- Show error if not admin -->
      <div *ngIf="errorMsg" class="alert alert-danger text-center mb-3">
        {{ errorMsg }}
      </div>

      <!-- Form always visible -->
      <div>
        <div class="form-group mb-3">
          <label class="fw-semibold">Username</label>
          <input
            [(ngModel)]="newUser.userName"
            class="form-control"
            placeholder="Enter username"
          />
        </div>

        <div class="form-group mb-3">
          <label class="fw-semibold">Password</label>
          <input
            [(ngModel)]="newUser.password"
            type="password"
            class="form-control"
            placeholder="Enter password"
          />
        </div>

        <div class="form-group mb-3">
          <label class="fw-semibold">Full Name</label>
          <input
            [(ngModel)]="newUser.fullName"
            class="form-control"
            placeholder="Enter full name"
          />
        </div>

        <div class="form-group mb-3">
          <label class="fw-semibold">Role</label>
          <select [(ngModel)]="newUser.role" class="form-control">
            <option value="">Select Role</option>
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="finance">Finance</option>
            <option value="hr">HR</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between mt-4">
          <button class="btn btn-secondary px-4" (click)="goBack()" [disabled]="isSubmitting">Cancel</button>
          <button class="btn btn-success px-4" (click)="saveUser()" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Saving...' : 'Save' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
