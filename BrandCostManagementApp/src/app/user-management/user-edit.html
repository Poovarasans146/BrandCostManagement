<div class="container py-4">
  <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white rounded-top-4">

      <div class="d-flex justify-content-between align-items-center">

        <h3 class="mb-0 fw-semibold"> ✏️ Edit User </h3>

        <span *ngIf="hasChanges()" class="badge bg-warning text-dark"> Unsaved Changes </span>

      </div>

    </div>

    <div class="card-body p-4">
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">User ID</label>
          <input type="text" class="form-control" formControlName="userId" readonly />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control" formControlName="userName" readonly />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" class="form-control" formControlName="fullName" />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Role</label>
          <select class="form-select" formControlName="role">
            <option value="">Select Role</option>
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="finance">Finance</option>
            <option value="hr">HR</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">

            <button type="button" class="btn btn-outline-secondary px-4" (click)="goBack()">
              <i class="bi bi-x-circle me-2"></i> Cancel
            </button>

            <button type="submit" class="btn btn-primary px-4" [disabled]="!editForm.dirty || editForm.invalid || isSubmitting">

                <i class="bi bi-save me-2"></i> {{ isSubmitting ? 'Updating...' : 'Update User' }}

            </button>

        </div>
      </form>
    </div>
  </div>
</div>
