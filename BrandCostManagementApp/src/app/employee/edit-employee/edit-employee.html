<div class="container py-4">
  <h2>Edit Employee</h2>

  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <!-- Employee ID (readonly) -->
    <div class="mb-3">
      <label class="form-label">Employee ID</label>
      <input type="text" class="form-control" formControlName="employeeId" [disabled]="true">
    </div>

    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" formControlName="name">
    </div>

    <!-- Mobile Number -->
    <div class="mb-3">
      <label class="form-label">Mobile Number</label>
      <input type="text" class="form-control" formControlName="mobileNumber">
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="emailId">
    </div>

    <!-- Gender -->
    <div class="mb-3">
      <label class="form-label">Gender</label>
      <input type="text" class="form-control" formControlName="gender">
    </div>

    <!-- Location -->
    <div class="mb-3">
      <label class="form-label">Location</label>
      <input type="text" class="form-control" formControlName="location">
    </div>

    <!-- Address -->
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input type="text" class="form-control" formControlName="address">
    </div>

    <!-- Manager Name -->
    <div class="mb-3">
      <label class="form-label">Manager Name</label>
      <input type="text" class="form-control" formControlName="managerName">
    </div>

    <!-- Role Status -->
    <div class="mb-3">
      <label class="form-label">Role Status</label>
      <input type="text" class="form-control" formControlName="roleStatus">
    </div>

    <!-- Date of Joining -->
    <div class="mb-3">
      <label class="form-label">Date of Joining</label>
      <input type="date" class="form-control" formControlName="doj">
    </div>

    <!-- Submit -->
    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Updating...' : 'Update' }}
    </button>
  </form>
</div>
