<div class="container py-4">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-primary text-white text-center rounded-top-4">
      <h3 class="mb-0 fw-semibold">✏️ Edit Employee Details</h3>
    </div>

    <div class="card-body p-4">
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <!-- Employee ID -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Employee ID</label>
            <input type="text" class="form-control" formControlName="employeeId" readonly>
          </div>

          <!-- Name -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Name</label>
            <input type="text" class="form-control" formControlName="name">
          </div>

          <!-- Mobile Number -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Mobile Number</label>
            <input type="text" class="form-control" formControlName="mobileNumber">
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" formControlName="emailId">
          </div>

          <!-- Gender -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Gender</label>
            <select class="form-select" formControlName="gender">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Transgender">Transgender</option>
            </select>
          </div>

          <!-- Location -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Location</label>
            <input type="text" class="form-control" formControlName="location">
          </div>

          <!-- Manager Name -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Manager Name</label>
            <input type="text" class="form-control" formControlName="managerName">
          </div>

          <!-- Role Status -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Role Status</label>
            <select class="form-select" formControlName="roleStatus">
              <option value="">Select Role</option>
              <option value="On-Role">On-Role</option>
              <option value="Off-Role">Off-Role</option>
            </select>
          </div>

          <!-- Date of Joining -->
          <div class="col-md-6 col-lg-6">
            <label class="form-label fw-semibold">Date of Joining</label>
            <input type="date" class="form-control" formControlName="doj">
          </div>

          <!-- Address (last field) -->
          <div class="col-12">
            <label class="form-label fw-semibold">Address</label>
            <textarea rows="2" class="form-control" formControlName="address"></textarea>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="text-center mt-4">
          <button class="btn btn-primary px-4 py-2 rounded-pill shadow-sm" type="submit" [disabled]="isSubmitting">
            <i class="bi bi-save me-2"></i>{{ isSubmitting ? 'Updating...' : 'Update Employee' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
