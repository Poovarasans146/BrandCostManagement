<div class="container py-3">
  <div class="card shadow-sm p-3">
    <div class="card-header bg-primary text-white text-center">
      <h4>Create Project</h4>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submitCreate()">
        <div class="row g-2">
          <div class="col-md-3">
            <label>BU</label>
            <select formControlName="buName" class="form-control" (change)="generateNextId()">
              <option value="">-- Select BU --</option>
              <option *ngFor="let b of bus" [value]="b">{{b}}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label>Project ID</label>
            <input formControlName="projectId" class="form-control" readonly />
          </div>
          <div class="col-md-3">
            <label>Project Name</label>
            <input formControlName="projectName" class="form-control"/>
          </div>
          <div class="col-md-3">
            <label>Brand</label>
            <input formControlName="brand" class="form-control"/>
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-md-3">
            <label>Approved Count</label>
            <input type="number" formControlName="approvedCount" class="form-control"/>
          </div>
          <div class="col-md-3">
            <label>Project Value</label>
            <input type="number" formControlName="projectValue" class="form-control"/>
          </div>
          <div class="col-md-3">
            <label>Start Date</label>
            <input type="date" formControlName="projectStartDate" class="form-control"/>
          </div>
          <div class="col-md-3">
            <label>End Date</label>
            <input type="date" formControlName="projectEndDate" class="form-control"/>
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-md-4">
            <label>Brand Logo</label>
            <input type="file" class="form-control" (change)="onLogoSelected($event)" accept=".png,.jpg,.jpeg"/>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create</button>
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
