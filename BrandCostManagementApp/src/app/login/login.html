<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-lg w-100" style="max-width: 400px; background-color:#f8f9fa;">
    <div class="text-center mb-3">
      <img src="/file5.png" alt="Logo" class="img-fluid" style="max-height: 200px; width: 200px;">
    </div><br />

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate>
      <!-- Username -->
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" [(ngModel)]="username" required>
        <div *ngIf="submitted && !username" class="text-danger small">
          Please enter username
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required>
        <div *ngIf="submitted && !password" class="text-danger small">
          Please enter password
        </div>
      </div>

      <!-- Forgot password -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a [routerLink]="['/forgot-password']" class="small text-primary">Forgot password?</a>
      </div>

      <!-- Login button -->
      <button type="submit" class="btn btn-primary w-100">
        Login
      </button>
    </form>
<!---
    <div *ngIf="errorMessage" class="text-danger mt-2 text-center">
      {{ errorMessage }}
    </div> -->
  </div>
</div>
