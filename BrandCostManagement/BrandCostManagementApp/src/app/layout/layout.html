<div class="d-flex flex-column min-vh-100">
  <!-- Header / Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm header-bg learnmore-bg">
    <div class="container">
      <!-- Brand -->
      <a class="navbar-brand fw-semibold" routerLink="/home">
        BrandCostManagement
      </a>

      <!-- Toggler (mobile only) -->
      <button
        class="navbar-toggler"
        type="button"
        (click)="toggleNavbar()"
        [attr.aria-expanded]="!isNavbarCollapsed"
        aria-controls="mainNav"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Collapsible Menu -->
      <div
        id="mainNav"
        class="collapse navbar-collapse"
        [ngClass]="{ show: !isNavbarCollapsed }"
      >
        <ul
          *ngIf="menuItems.length > 0"
          class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-2"
        >
          <li *ngFor="let item of menuItems" class="nav-item">
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              class="nav-link"
              (click)="closeNavbar()"
            >
              {{ item.label }}
            </a>
          </li>

          <!-- Logout -->
          <li class="nav-item">
            <button
              class="btn btn-outline-light ms-lg-3 logout-btn"
              (click)="logout()"
            >
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="flex-grow-1 m-0 p-0">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-3 border-top bg-light">
    <div
      class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2"
    >
      <span class="text-muted"
        >© {{ currentYear }} TVSE • Brand Cost Management</span
      >
      <div class="d-flex gap-3 fs-5">
        <a
          href="https://www.instagram.com/tvselectronics/"
          target="_blank"
          rel="noopener"
          class="text-decoration-none text-muted"
        >
          <i class="bi bi-instagram"></i>
        </a>
        <a
          href="https://in.linkedin.com/company/tvs-electronics"
          target="_blank"
          rel="noopener"
          class="text-decoration-none text-muted"
        >
          <i class="bi bi-linkedin"></i>
        </a>
        <a
          href="https://www.tvselectronics.in/"
          target="_blank"
          rel="noopener"
          class="text-decoration-none text-muted"
        >
          <i class="bi bi-globe"></i>
        </a>
      </div>
    </div>
  </footer>
</div>
