<!-- src/app/pages/projects/projects-edit.component.html -->
<div class="page container">
  <h2>Edit Project</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="card p-3">
    <div class="row">
      <div class="col-md-3">
        <label>BU</label>
        <input class="form-control" formControlName="buName" readonly />
      </div>

      <div class="col-md-3">
        <label>Project ID</label>
        <input class="form-control" formControlName="projectId" readonly />
      </div>

      <div class="col-md-3">
        <label>Project Name</label>
        <input class="form-control" formControlName="projectName" />
      </div>

      <div class="col-md-3">
        <label>Brand</label>
        <input class="form-control" formControlName="brand" />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-3">
        <label>Approved Count</label>
        <input type="number" class="form-control" formControlName="approvedCount" />
      </div>

      <div class="col-md-3">
        <label>Project Value</label>
        <input type="number" class="form-control" formControlName="projectValue" />
      </div>

      <div class="col-md-3">
        <label>Start Date</label>
        <input type="date" class="form-control" formControlName="projectStartDate" />
      </div>

      <div class="col-md-3">
        <label>End Date</label>
        <input type="date" class="form-control" formControlName="projectEndDate" />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <label>Brand Logo</label>
        <input type="file" class="form-control" (change)="onFileChange($event)" accept=".png,.jpg,.jpeg" />
        <div class="mt-2" *ngIf="project?.brandLogo && !logoFile">
          <!-- display current logo preview if existing and no new file selected -->
          <img [src]="'data:image/*;base64,' + project?.brandLogo" style="max-width:150px;max-height:80px;object-fit:contain" />
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="loading">Save</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="loading">Cancel</button>
    </div>
  </form>
</div>
