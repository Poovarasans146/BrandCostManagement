<div class="container py-4">
  <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white text-center rounded-top-4">
      <h3 class="mb-0 fw-semibold">✏️ Edit User</h3>
    </div>

    <div class="card-body p-4">
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">User ID</label>
          <input type="text" class="form-control" formControlName="userId" readonly />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control" formControlName="userName" readonly />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" class="form-control" formControlName="fullName" />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Role</label>
          <select class="form-select" formControlName="role">
            <option value="">Select Role</option>
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
            <option value="finance">Finance</option>
            <option value="hr">HR</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-secondary px-4" (click)="goBack()">Cancel</button>
          <button type="submit" class="btn btn-primary px-4" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Updating...' : 'Update' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
