<div class="container py-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="m-0 text-primary fw-bold">
      <i class="bi bi-people-fill me-2"></i>User Management
    </h2>
    <div class="d-flex gap-2 flex-wrap">
      <button (click)="addUser()" class="btn btn-success">
        <i class="bi bi-person-plus-fill me-1"></i> Add User
      </button>
      <button (click)="deleteSelected()" class="btn btn-danger">
        <i class="bi bi-trash3-fill me-1"></i> Delete Selected
      </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="input-group mb-3 shadow-sm">
    <span class="input-group-text bg-primary text-white">
      <i class="bi bi-search"></i>
    </span>
    <input
      [(ngModel)]="searchTerm"
      placeholder="Search by username or fullname"
      class="form-control"
    />
    <button (click)="search()" class="btn btn-outline-primary">Search</button>
  </div>

  <!-- Responsive Table -->
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-primary">
        <tr>
          <th scope="col">
            <input type="checkbox" (change)="toggleSelectAll($event)" />
          </th>
          <th scope="col">#ID</th>
          <th scope="col">Username</th>
          <th scope="col">Full Name</th>
          <th scope="col">Role</th>
          <th scope="col" class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td><input type="checkbox" [(ngModel)]="user.selected" /></td>
          <td>{{ user.userId }}</td>
          <td>{{ user.userName }}</td>
          <td>{{ user.fullName }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-primary': user.role === 'admin',
                'bg-success': user.role === 'manager',
                'bg-warning text-dark': user.role === 'finance',
                'bg-info text-dark': user.role === 'hr',
                'bg-secondary': user.role === 'viewer'
              }"
            >
              {{ user.role | titlecase }}
            </span>
          </td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning" (click)="editUser(user.userId)">
              <i class="bi bi-pencil-square"></i> Edit
            </button>
          </td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td colspan="6" class="text-center text-muted py-3">
            <i class="bi bi-info-circle"></i> No users found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
