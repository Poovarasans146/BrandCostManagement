<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-lg w-100" style="max-width: 400px; background-color:#f8f9fa;">
    
    <!-- Logo -->
    <div class="text-center mb-3">
      <img src="/file5.png" alt="Logo" class="img-fluid" style="max-height: 200px; width: 200px;">
    </div>

    <h4 class="text-center mb-3">Forgot Password</h4>

    <!-- Step 1: Enter Username / Email -->
    <form *ngIf="step==='username'" (ngSubmit)="onSubmitUsername()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email / Username</label>
        <input type="text" class="form-control" [(ngModel)]="username" name="username" placeholder="Enter your email id" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <!-- Step 2: Enter OTP -->
    <form *ngIf="step==='otp'" (ngSubmit)="onSubmitOtp()" novalidate>
      <div class="mb-3">
        <label class="form-label">Enter OTP</label>
        <input type="text" class="form-control" [(ngModel)]="otp" name="otp" placeholder="Enter the OTP" maxlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
    </form>

    <!-- Step 3: Reset Password -->
    <form *ngIf="step==='reset'" (ngSubmit)="onResetPassword()" novalidate>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Reset Password</button>
    </form>

  </div>
</div>
